[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "flight-search-demo"
version = "0.1.0"
description = "Controlled-page browser stack spike for Gemini, browser-use, and self-hosted Steel."
requires-python = ">=3.11"
dependencies = [
  "airportsdata==20260905",
  "browser-use>=0.8.0",
  # Interactions is experimental; keep the tested 1.75 minor line reversible.
  "google-genai>=1.75,<1.76",
  "pydantic>=2.11,<3",
  "python-dotenv>=1.0.1,<2",
  "steel-sdk>=0.6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
